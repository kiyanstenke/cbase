<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cbase — Connect</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid; place-items: center;
    background: #eeece6; color: #1c1c20;
    -webkit-app-region: drag; /* window-wide drag region — the card opts out */
  }
  .card {
    -webkit-app-region: no-drag;
    width: 380px; padding: 30px; border-radius: 24px;
    background: #ffffff; border: 1px solid #ddd9cf;
    box-shadow: 0 18px 50px rgba(0,0,0,.12);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .brand .mark { width: 30px; height: 30px; }
  .brand .mark-light { display: none; }
  .brand b { font-size: 16px; letter-spacing: -0.02em; }
  .brand small { display: block; font-weight: 400; opacity: .6; }
  label { display: block; font-size: 13px; opacity: .75; margin-bottom: 18px; }
  input {
    width: 100%; margin-top: 6px; font: inherit; color: inherit;
    padding: 10px 16px; border-radius: 999px; border: 1px solid #ddd9cf; background: #faf9f5;
    outline: none;
  }
  input:focus { border-color: #1f57f7; }
  button {
    width: 100%; font: inherit; font-weight: 500; color: #fff;
    background: #1f57f7; border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: #d9534f; font-size: 13px; min-height: 1.4em; margin-bottom: 12px; }
  .hint { font-size: 12px; opacity: .65; margin-top: 16px; color: #55524a; }
  /* Dark mode LAST — same specificity, the later rule wins. */
  @media (prefers-color-scheme: dark) {
    body { background: #101014; color: #e8e8ec; }
    .card { background: #17171d; border-color: #26262e; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
    input { background: #101016; border-color: #33333f; color: #e8e8ec; }
    input:focus { border-color: #4d89ff; }
    button { background: #4d89ff; }
    .hint { color: #8b8b95; }
    .brand .mark-ink { display: none; }
    .brand .mark-light { display: inline; }
  }
</style>
</head>

      <b>cbase<small>Connect to a server</small></b>
    </div>
    <label>Server address
      <input id="url" placeholder="https://cbase.example.com" autofocus spellcheck="false" autocomplete="off">
    </label>
    <div class="err" id="err"></div>
    <button id="go" type="submit">Connect</button>
    <div class="hint">You get the address from the person who runs your cbase server. Sign-in follows in the next step.</div>
  </form>
<script>
  const $ = (id) => document.getElementById(id);
  window.cbaseClient?.getServer().then((u) => { if (u) $("url").value = u; });
  $("f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    $("err").textContent = ""; $("go").disabled = true; $("go").textContent = "Connecting…";
    try {
      const r = await window.cbaseClient.connect($("url").value);
      if (r?.error) { $("err").textContent = r.error; }
      // on success the main process loads the server URL — this page disappears
    } catch (e) {
      $("err").textContent = String(e?.message || e);
    } finally {
      $("go").disabled = false; $("go").textContent = "Connect";
    }
  });
</script>
</body>
</html>
