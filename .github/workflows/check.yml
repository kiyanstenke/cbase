name: check

# Every pull request and every push to `main` (and on demand): `./check --short` — all checks and the short suites, about ten minutes.
# The long backend suite never runs here: it needs about an hour on the runner's two cores. It runs in the full `./check` on a
# developer machine before every commit to `main`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Third-party actions are pinned to full commit SHAs (a tag can be moved); the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install gitleaks
        # The expected SHA-256 is the line for gitleaks_8.30.1_linux_x64.tar.gz in the release's gitleaks_8.30.1_checksums.txt; a
        # version bump changes both the URL and this value.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Install dependencies
        run: |
          (cd web && npm ci)
          (cd client && npm ci)
          # onnxruntime-node fetches its CUDA build on linux/x64 from an address that answers 404 since November 2026 (same switch as server/backend/Dockerfile).
          (cd server/backend && ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm ci)
          chmod +x server/backend/node_modules/node-pty/prebuilds/*/spawn-helper || true
      - name: Gate
        run: ./check --short
