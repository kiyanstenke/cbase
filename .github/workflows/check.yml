name: check

# Every pull request and every push to `main`: `./check --short` (all checks and the short suites, about ten minutes). The long backend suite needs
# about an hour on the runner's two cores — it runs in the full `./check` every night and on demand (Actions → check → Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The full gate (nightly, on demand): the backend suite alone takes about 65 min on the runner's two cores. The short one: ~10 min.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 120 || 40 }}
    steps:
      # Third-party actions are pinned to full commit SHAs (a tag can be moved); the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install gitleaks
        # The expected SHA-256 is the line for gitleaks_8.30.1_linux_x64.tar.gz in the release's gitleaks_8.30.1_checksums.txt; a
        # version bump changes both the URL and this value.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Browser and ffmpeg for the real-browser tests
        run: |
          # The backend suite starts a real Chromium (browsers.js resolveChromium, CBASE_CHROMIUM first) and builds MP4s with ffmpeg
          # (captures.js) — the container image ships both, the runner image does not promise ffmpeg. The runner's /usr/bin/chromium is a
          # Chromium snapshot without SUID sandbox; Ubuntu 24.04 restricts unprivileged user namespaces with AppArmor, so it dies at
          # once with "No usable sandbox!" (Chromium ended (code 1)). Google Chrome's package brings chrome-sandbox and Ubuntu's
          # AppArmor profile for it: take that one, and start it once here so a broken browser is named here, not in the suite.
          command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          ffmpeg -version | head -1
          chrome="$(command -v google-chrome)"
          "$chrome" --version
          timeout 60 "$chrome" --headless=new --dump-dom about:blank > /dev/null
          echo "CBASE_CHROMIUM=$chrome" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: |
          (cd web && npm ci)
          (cd client && npm ci)
          # onnxruntime-node fetches its CUDA build on linux/x64 from an address that answers 404 since November 2026 (same switch as server/backend/Dockerfile).
          (cd server/backend && ONNXRUNTIME_NODE_INSTALL_CUDA=skip npm ci)
          chmod +x server/backend/node_modules/node-pty/prebuilds/*/spawn-helper || true
      - name: Gate
        env:
          # The gate's emergency cap per suite is one hour (tools/check/lib/gate-plan.mjs SUITE_CAP_MS); the backend suite needs about
          # 65 min on the runner's two cores (run 44865499914: 3267 of ~3570 tests after 60 min). The stall rule (300 s) still applies.
          CBASE_SUITE_TIMEOUT_MS: "5400000"
          FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$FULL" = "true" ]; then ./check; else ./check --short; fi
