name: release

# A pushed tag v<version> (VERSIONING.md, "Release procedure"): check that the tag is the product version, that the tagged commit is
# on main and that CHANGELOG.md has the section, run the version tests, then create a DRAFT GitHub release with that section as
# its notes. Publishing stays a maintainer's step. Held by tools/check/release-workflow.test.mjs.
on:
  push:
    tags: ["v*"]

# The only workflow that may write: creating the draft release needs contents: write, nothing else.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to full commit SHAs (a tag can be moved); the same SHAs as in check.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: The tag is the product version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node tools/version.mjs)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the product version $version (node tools/version.mjs)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: The tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse "$TAG^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::the commit of $TAG ($commit) is not on main"
            exit 1
          fi
      - name: CHANGELOG.md has the section of the release
        run: node tools/version.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
      - name: Version tests
        run: node --test --test-reporter=tap tools/check/version.test.mjs
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "cbase $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
